  mesh:'#b5c9d7', blue:'#2d78a8', blue2:'#5b9bbd', red:'#a84643',
  amber:'#ae7839', green:'#438874', line:'#d3e0e9'
};
const GROUPS=['#245785','#397ba4','#68a4bc','#8abfd0'];
const G={xLeft:170,xRight:914,y:305,side:78,gap:18,step:96};

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const smooth=x=>{const z=clamp(x);return z*z*(3-2*z)};
const progress=(t,a,b)=>smooth((t-a)/(b-a));
const blend=(a,b,t)=>a+(b-a)*t;
const alphaWindow=(t,a,b,fade=.42)=>Math.min(progress(t,a,a+fade),1-progress(t,b-fade,b));
function box(ctx,x,y,w,h,r=8){
  const q=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+q,y);ctx.lineTo(x+w-q,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+q);ctx.lineTo(x+w,y+h-q);ctx.quadraticCurveTo(x+w,y+h,x+w-q,y+h);
  ctx.lineTo(x+q,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-q);ctx.lineTo(x,y+q);ctx.quadraticCurveTo(x,y,x+q,y);ctx.closePath();
}
function fillText(ctx,s,x,y,size=20,color=COLORS.dark,align='left',bold=false){
  ctx.save();ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';
  ctx.font=`${size}px ${bold?'MoHanBold':'MoHan'}`;ctx.fillText(s,x,y);ctx.restore();
}
function point(which,r,c){const x=which==='left'?G.xLeft:G.xRight;return {x:x+c*G.step+G.side/2,y:G.y+r*G.step+G.side/2};}
function routeLine(ctx,which,route,color,width=3,alpha=1,dash=[]){
  ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.globalAlpha=alpha;ctx.lineCap='round';ctx.lineJoin='round';ctx.setLineDash(dash);
  ctx.beginPath();route.forEach(([r,c],i)=>{const p=point(which,r,c);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)});ctx.stroke();ctx.restore();
}
function routePosition(which,route,u){
  const pts=route.map(([r,c])=>point(which,r,c));let len=0;const lens=[];
  for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);lens.push(d);len+=d;}
  let traveled=clamp(u)*len;
  for(let i=0;i<lens.length;i++){if(traveled<=lens[i]||i===lens.length-1){const v=clamp(traveled/lens[i]);return {x:blend(pts[i].x,pts[i+1].x,v),y:blend(pts[i].y,pts[i+1].y,v)}}traveled-=lens[i]}
  return pts[pts.length-1];
}
function token(ctx,p,r=7,color=COLORS.blue){ctx.save();ctx.fillStyle=color;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='white';ctx.stroke();ctx.restore()}
function microExperts(ctx,t){
  const a=1-progress(t,3.55,4.0);if(a<=0)return;ctx.save();ctx.globalAlpha=a;
  const xs=[505,665,825],ys=[236,236,236];
  xs.forEach((x,i)=>{
    const endpoint=x+83;ctx.lineWidth=2;ctx.strokeStyle='#b7cbd8';ctx.beginPath();ctx.moveTo(x+25,ys[i]);ctx.lineTo(endpoint-22,ys[i]);ctx.stroke();
    box(ctx,endpoint-20,ys[i]-24,46,47,6);ctx.fillStyle='#f8fbfd';ctx.fill();ctx.strokeStyle=COLORS.navy;ctx.lineWidth=1.5;ctx.stroke();
    fillText(ctx,'E'+(i+1),endpoint+3,ys[i]+7,17,COLORS.navy,'center',true);
    box(ctx,x-30,ys[i]-11,26,22,4);ctx.fillStyle=COLORS.blue;ctx.fill();
    const u=(t*0.62+i*0.31)%1;token(ctx,{x:blend(x+4,endpoint-17,u),y:ys[i]},5,COLORS.blue2);
  });
  ctx.restore();
}
function groupAt(r,c,entwined){return entwined?((r%2)*2+(c%2)):(Math.floor(r/2)*2+Math.floor(c/2))}
function drawMesh(ctx,which,changed,t){
  const left=which==='left',gx=left?G.xLeft:G.xRight,s=G.side,st=G.step;
  const tileCenter=(r,c)=>point(which,r,c);
  const remap=left?0:progress(t,9.5,12.0);
  const ftd=left?0:progress(t,11.2,12.4);
  if(ftd>0){ctx.save();ctx.globalAlpha=.65*ftd;ctx.strokeStyle=COLORS.blue2;ctx.lineWidth=2.2;ctx.setLineDash([7,6]);
    for(let rr=0;rr<4;rr+=2)for(let cc=0;cc<4;cc+=2){box(ctx,gx+cc*st-8,G.y+rr*st-8,2*s+G.gap+16,2*s+G.gap+16,10);ctx.stroke()}
    ctx.restore();}
  // The mesh connections, square units and original expert never move.
  ctx.save();ctx.lineWidth=2;ctx.strokeStyle=COLORS.mesh;ctx.lineCap='round';
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    const x=gx+c*st,y=G.y+r*st;
    if(c<3){ctx.beginPath();ctx.moveTo(x+s,y+s/2);ctx.lineTo(x+st,y+s/2);ctx.stroke()}
    if(r<3){ctx.beginPath();ctx.moveTo(x+s/2,y+s);ctx.lineTo(x+s/2,y+st);ctx.stroke()}
  }
  ctx.restore();
  if(left && t>=4.3){const a=progress(t,4.3,5);[
     [[3,0],[2,0],[1,0],[1,1],[1,2]],
     [[0,0],[0,1],[1,1],[1,2]]
  ].forEach((path,i)=>routeLine(ctx,'left',path,COLORS.red,4.0,a*(i?0.63:.78)));}
  if(!left && t>=11.7){const a=progress(t,11.7,12.6);[
     [[0,2],[1,2]],[[1,3],[1,2]]
  ].forEach(path=>routeLine(ctx,'right',path,COLORS.blue,3.8,.72*a));}
  // Tile interiors. Source E1 is retained; shadow adds capacity only after copying.
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    const x=gx+c*st,y=G.y+r*st,source=r===1&&c===2,shadow=!left&&r===2&&c===2;
    ctx.save();box(ctx,x,y,s,s,8);ctx.fillStyle='#fbfdff';ctx.fill();
    ctx.lineWidth=source?2.7:1.7;ctx.strokeStyle=source?COLORS.red:COLORS.navy;ctx.stroke();
    // Group badge means data placement, not which expert is selected.
    const old=groupAt(r,c,false),neo=groupAt(r,c,true),a=remap;
    const badge=(idx,opacity)=>{ctx.globalAlpha=opacity;box(ctx,x+9,y+8,23,19,3);ctx.fillStyle=GROUPS[idx];ctx.fill();fillText(ctx,String(idx+1),x+20.5,y+22,13,'white','center',true)};
    badge(old,1-a);if(!left&&a>0)badge(neo,a);ctx.globalAlpha=1;
    if(shadow){
      // Existing resident expert (E) remains on the destination compute unit.
      box(ctx,x+10,y+36,26,28,4);ctx.fillStyle='#e6eef4';ctx.fill();ctx.strokeStyle='#8da8bc';ctx.lineWidth=1.3;ctx.stroke();
      fillText(ctx,'E',x+23,y+57,17,COLORS.navy,'center',true);
      const done=progress(t,19.35,19.75),slotA=progress(t,14.6,15.4);
      ctx.save();ctx.globalAlpha=slotA;
      box(ctx,x+40,y+36,28,28,4);ctx.fillStyle=done?'#ebf6f1':'#f7fafc';ctx.fill();
      ctx.strokeStyle=done?COLORS.green:'#a7b7c3';ctx.lineWidth=done?2.4:1.5;ctx.setLineDash(done?[]:[3,3]);ctx.stroke();ctx.setLineDash([]);
      if(done>.85)fillText(ctx,'E1',x+54,y+54,12,COLORS.green,'center',true);
      ctx.restore();
    }else{
      box(ctx,x+15,y+36,48,27,4);ctx.fillStyle=source?'#fbebea':'#eaf2f7';ctx.fill();ctx.strokeStyle=source?COLORS.red:'#98b5c7';ctx.lineWidth=1.25;ctx.stroke();
      fillText(ctx,source?'E1':'E',x+39,y+56,19,source?COLORS.red:COLORS.navy,'center',true);
    }
    ctx.restore();
  }
  if(left && t>=4.4){const a=progress(t,4.4,5.0);ctx.save();ctx.globalAlpha=a;
    // Queue marks are tokens waiting near the same expert, not extra experts.
    const p=tileCenter(1,2);for(let i=0;i<3;i++){box(ctx,p.x-24+i*17,p.y-57,12,9,2);ctx.fillStyle=COLORS.red;ctx.fill()}
    fillText(ctx,'Queue',p.x+55,p.y-49,16,COLORS.red,'left',true);ctx.restore();
    const paths=[[[3,0],[2,0],[1,0],[1,1],[1,2]],[[0,0],[0,1],[1,1],[1,2]]];
    paths.forEach((path,i)=>{const u=((Math.min(t,21)-4.4)*.44+i*.48)%1;token(ctx,routePosition('left',path,u),6,COLORS.blue)});
  }
  if(!left && t>=12.0 && t<20){const fade=progress(t,12,12.7)*(1-progress(t,15.0,15.9));
    if(fade>0){const paths=[[[0,2],[1,2]],[[1,3],[1,2]]];paths.forEach((path,i)=>{ctx.save();ctx.globalAlpha=fade;token(ctx,routePosition('right',path,((t-12)*.58+i*.41)%1),6,COLORS.blue);ctx.restore()})}
  }
}
function drawWeightCopy(ctx,t){
  if(t<15||t>=21)return;
  const stages=[{a:15,b:16.35,route:[[1,2],[1,3]],type:'Attention phase · Free intra-region paths'},
                {a:16.35,b:17.8,route:[[1,3],[2,3]],type:'Expert phase · Free inter-region paths'},
                {a:17.8,b:19.2,route:[[2,3],[2,2]],type:'Attention phase · Free intra-region paths'}];
  stages.forEach((s,i)=>{
    if(t<s.a)return;const complete=t>=s.b;ctx.save();ctx.globalAlpha=complete?.37:1;
    routeLine(ctx,'right',s.route,COLORS.amber,4,1,[7,5]);ctx.restore();
    if(!complete){const p=routePosition('right',s.route,progress(t,s.a,s.b));
      ctx.save();box(ctx,p.x-8,p.y-8,16,16,2);ctx.fillStyle=COLORS.amber;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='white';ctx.stroke();ctx.restore();}
  });
  const current=stages.find(s=>t>=s.a&&t<s.b);
  if(current){fillText(ctx,current.type,1077,252,17,COLORS.amber,'center',false)}
  else if(t<19.75){fillText(ctx,'No tasks until the weight copy is complete',1077,252,16,COLORS.amber,'center',false)}
  else fillText(ctx,'Weights complete; replica can accept tasks',1077,252,16,COLORS.green,'center',false);
}
function drawSplit(ctx,t){
  if(t<19.75)return;const a=progress(t,19.75,20.25),source=point('right',1,2),dest=point('right',2,2);
  ctx.save();ctx.globalAlpha=a;
  // Solid blue denotes ordinary token requests; these appear only after E1's full copy.
  const start1={x:1305,y:source.y},start2={x:1305,y:dest.y};
  ctx.strokeStyle=COLORS.blue;ctx.lineWidth=2.8;ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(start1.x,start1.y);ctx.lineTo(source.x+34,source.y);ctx.moveTo(start2.x,start2.y);ctx.lineTo(dest.x+34,dest.y);ctx.stroke();
  token(ctx,{x:blend(start1.x,source.x+33,((Math.min(t,21)-19.75)*.8)%1),y:start1.y},6,COLORS.blue);
  token(ctx,{x:blend(start2.x,dest.x+33,((Math.min(t,21)-19.75)*.8+.38)%1),y:start2.y},6,COLORS.blue);
  fillText(ctx,'Share',1305,source.y-18,16,COLORS.green,'center',true);
  fillText(ctx,'Share',1305,dest.y-18,16,COLORS.green,'center',true);
  ctx.restore();
}
function drawLegend(ctx,t){
  fillText(ctx,'Boxes = fixed compute units   E = model expert   Colored marks = data groups',88,758,16,COLORS.muted);
  if(t>=15){ctx.save();ctx.strokeStyle=COLORS.amber;ctx.lineWidth=3;ctx.setLineDash([7,5]);ctx.beginPath();ctx.moveTo(821,752);ctx.lineTo(866,752);ctx.stroke();ctx.restore();
    fillText(ctx,'Weight copy',875,758,16,COLORS.muted);
    token(ctx,{x:1030,y:752},5,COLORS.blue);fillText(ctx,'Normal data',1044,758,16,COLORS.muted);
  }
}
function narrative(ctx,t){
  const messages=[
    [0,4,'Route data to the experts selected by the model'],
    [4,9,'Long paths cause congestion; popular experts may queue'],
    [9,15,'Co-design data layout so required data can be accessed locally'],
    [15,19.75,'Borrow idle paths by phase to copy popular experts’ weights'],
    [19.75,21,'Share requests only after the replica is complete'],
    [21,24.1,'Together, the mechanisms ease communication and expert load imbalance']
  ];
  messages.forEach(([a,b,s])=>{const v=a===21?progress(t,21,21.5):(a===0?1-progress(t,3.6,4):alphaWindow(t,a,b,.4));if(v>0){ctx.save();ctx.globalAlpha=v;fillText(ctx,s,720,193,25,COLORS.dark,'center',true);ctx.restore()}});
  if(t>=9&&t<21){ctx.save();ctx.globalAlpha=alphaWindow(t,9,21,.5);
    fillText(ctx,t<15?'ER-Mapping · Preserve aggregation, interleave groups':'NI-Balancer · Load balance',1079,230,16,COLORS.blue,'center');ctx.restore()}
}
function drawFooter(ctx,t){
  const before=alphaWindow(t,4,21,.45);if(before>0){ctx.save();ctx.globalAlpha=before;
    fillText(ctx,'Long paths, central congestion, hot-expert queues',353,714,18,COLORS.red,'center');
    fillText(ctx,t<15?'Local access, shorter paths':'Layout retained; expert replicas become ready',1097,714,18,t<15?COLORS.blue:COLORS.green,'center');ctx.restore();}
  const final=progress(t,20.85,21.55);if(final>0){ctx.save();ctx.globalAlpha=final;
    fillText(ctx,'Shorter data paths, less expert waiting',720,719,32,COLORS.navy,'center',true);
    ctx.strokeStyle=COLORS.green;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(485,734);ctx.lineTo(955,734);ctx.stroke();ctx.restore()}
  drawLegend(ctx,t);
  ctx.save();ctx.strokeStyle='#e0e9ee';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(88,774);ctx.lineTo(1352,774);ctx.stroke();ctx.restore();
  fillText(ctx,'Mechanism schematic; not performance scale',1352,798,14,'#748896','right');
}
function drawFrame(ctx,time){
  const t=clamp(time,0,DURATION);ctx.clearRect(0,0,MW,MH);ctx.fillStyle='white';ctx.fillRect(0,0,MW,MH);
  ctx.fillStyle=COLORS.navy;ctx.fillRect(78,54,9,48);
  fillText(ctx,'MoEntwine',105,92,43,COLORS.navy,'left',true);
  fillText(ctx,'Coordinating experts across the wafer',363,90,37,COLORS.navy,'left',true);
  ctx.strokeStyle='#d6e4ed';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(78,127);ctx.lineTo(1360,127);ctx.stroke();
  narrative(ctx,t);microExperts(ctx,t);
  ctx.save();ctx.strokeStyle='#e4ecf2';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(720,282);ctx.lineTo(720,682);ctx.stroke();ctx.restore();
  fillText(ctx,'Conventional layout',353,285,23,COLORS.navy,'center',true);
  fillText(ctx,'MoEntwine co-designed layout',1097,285,23,COLORS.navy,'center',true);
  drawMesh(ctx,'left',false,t);drawMesh(ctx,'right',true,t);drawWeightCopy(ctx,t);drawSplit(ctx,t);drawFooter(ctx,t);
}
</script>
<script>
(() => {
  const canvas=document.getElementById('moentwine'),ctx=canvas.getContext('2d');
  const seek=document.getElementById('seek'),clock=document.getElementById('clock'),play=document.getElementById('play');
  let at=0,playing=false,start=0,raf=0;
  const refresh=()=>{drawFrame(ctx,at);seek.value=at.toFixed(2);clock.textContent=`${at.toFixed(2)} / 24.00 s`;play.textContent=playing?'Pause':'Play';};
  function tick(now){if(!playing)return;at=Math.min(DURATION,(now-start)/1000);refresh();if(at>=DURATION){playing=false;refresh();return}raf=requestAnimationFrame(tick)}
  function resume(){if(at>=DURATION)at=0;playing=true;start=performance.now()-at*1000;raf=requestAnimationFrame(tick);refresh()}
  play.addEventListener('click',()=>{if(playing){playing=false;cancelAnimationFrame(raf);refresh()}else resume()});
  document.getElementById('restart').addEventListener('click',()=>{cancelAnimationFrame(raf);at=0;resume()});
  seek.addEventListener('input',()=>{playing=false;cancelAnimationFrame(raf);at=Number(seek.value);refresh()});
  window.drawAt=t=>{playing=false;cancelAnimationFrame(raf);at=Math.min(DURATION,Math.max(0,t));refresh()};
  document.fonts.ready.then(()=>{refresh();});
})();
</script>
