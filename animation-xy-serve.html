function renderAt(raw){let t=clamp(raw,0,DURATION);if(t>=29.8)t=29.8;g.fillStyle='#fff';g.fillRect(0,0,W,H);header(t);reqView(t);coreView(t);mid(t);moveTasks(t);if(t<21.4)bottomLoad(t);else if(t<25.7)attention(t);else linear(t);footer(t);return true}window.renderAt=renderAt;
let begin=performance.now(),paused=false,pauseTime=0,raf=0;function frame(now){let t=paused?pauseTime:Math.min(DURATION,(now-begin)/1000);renderAt(t);if(document.activeElement!==document.getElementById('progress'))document.getElementById('progress').value=t;document.getElementById('clock').textContent=t.toFixed(1)+'s';if(!paused&&t<DURATION)raf=requestAnimationFrame(frame)}
document.getElementById('toggle').onclick=()=>{if(paused){paused=false;begin=performance.now()-pauseTime*1000;document.getElementById('toggle').textContent='暂停';raf=requestAnimationFrame(frame)}else{paused=true;pauseTime=+document.getElementById('progress').value;document.getElementById('toggle').textContent='播放';cancelAnimationFrame(raf)}};
document.getElementById('restart').onclick=()=>{paused=false;begin=performance.now();document.getElementById('toggle').textContent='暂停';cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)};document.getElementById('progress').oninput=e=>{paused=true;cancelAnimationFrame(raf);pauseTime=+e.target.value;renderAt(pauseTime);document.getElementById('toggle').textContent='播放';document.getElementById('clock').textContent=pauseTime.toFixed(1)+'s'};renderAt(0);document.fonts.ready.then(()=>{renderAt(0);raf=requestAnimationFrame(frame)});
