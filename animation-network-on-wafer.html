      const ids=new Set(LEDGER.packets.filter(p=>p.chunk===ch&&p.kind==='local_reduce'&&p.target===nd).map(p=>p.id));buffers[nd]=buffers[nd].filter(id=>!ids.has(id));if(ev.action==='group_reduce_complete')localReady[ch+':'+nd]=ev.value;
    }else if(ev.action==='switch_global_reduce_complete'){
      const ids=new Set(LEDGER.packets.filter(p=>p.chunk===ch&&p.kind==='uplink').map(p=>p.id));buffers.SW=buffers.SW.filter(id=>!ids.has(id));fabricReady[ch]=ev.value;
    }else if(ev.action==='commit_output'){
      const ids=new Set(LEDGER.packets.filter(p=>p.chunk===ch&&(p.kind==='downlink'||p.kind==='broadcast')&&p.target===nd).map(p=>p.id));buffers[nd]=buffers[nd].filter(id=>!ids.has(id));outputs[nd][ch]=ev.value;
    }
  }
  return {buffers,outputs,localReady,fabricReady};
}
