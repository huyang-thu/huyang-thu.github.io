function sideRequest(t){txt('KV placement + capacity',1008,197,26,C.navy,true);
 txt('7 DRAM slots/die; 2 for model weights',1008,237,17,C.muted);
 memBar('N12',276,t);memBar('N22',382,t);
 bufferBar('read',478,t);bufferBar('write',516,t);
 line([[1009,552],[1349,552]],C.soft,2);
 let s='',sub='';
 if(t<15.9){s='R1 Prefill running';sub='KV not yet committed as valid';}
 else if(t<16.4){s='R1 creates 3 initial KV slots';sub='Store at P1; allocate within associated set';}
 else if(t<18.56){s='Reserve 1 D1 slot before KV transfer';sub='Reservation does not imply valid KV';}
 else if(t<18.68){s='D1 received KV; P1 awaits ack to free';sub='Temporary duplication tracked during transfer';}
 else if(t<19.65){s='KV split across D1 and P1 DRAM';sub='Store nearby; not all KV moves to Decode';}
 else if(t<21.4){s='Decode reads its request’s remote KV';sub='2 segments, 1 hop each, into read buffer';}
 else if(t<21.55){s='Read buffer ready; Decode not started';sub='KV valid, not yet consumed';}
 else if(t<24.5){s='Consume buffer; run one Decode step';sub='One iteration and one request shown';}
 else if(t<24.7){s='Reserve space for new KV';sub='No output yet; write buffer empty';}
 else if(t<26.08){s='New token: buffered writeback';sub='New KV enters bounded write buffer first';}
 else if(t<27.1){s='KV growth complete: 4 total slots';sub='New KV stored in associated P1 DRAM';}
 else if(t<29.1){s='Space too small: stall R2 onward';sub='2 slots free, R2 needs 4; do not run OOM';}
 else {s='R1 ends; release all of its KV';sub='Keep other requests’ KV and model weights';}
 txt(s,1008,590,21,t>=27.1&&t<29.1?C.orange:C.navy,true);
 txt(sub,1008,629,18,C.muted);
 tag('W weights',1008,679,100,32,C.navy);tag('Other KV',1118,679,94,32,C.gray,C.white);tag('R1 KV',1220,679,88,32,C.teal);tag('Rsvd',1316,679,58,32,C.orangeLite,C.orange,17);
}

function renderAt(raw){currentT=clamp(raw,0,SC.hold_from);header(currentT);meshBoard(currentT);
 const ph=stage(currentT).id;if(ph==='offline')sideOffline(currentT);else if(ph==='placement')sidePlacement(currentT);else if(ph==='request')sideRequest(currentT);else if(ph==='architecture')sideArchitecture(currentT);else sideFinal();footer();return true;}
window.renderAt=renderAt;window.getTextBounds=()=>TEXT_BOUNDS;
let started=performance.now(),paused=false,pauseAt=0,raf=0;
function animate(now){const t=paused?pauseAt:Math.min(LENGTH,(now-started)/1000);renderAt(t);const p=document.getElementById('progress');if(document.activeElement!==p)p.value=t;document.getElementById('clock').textContent=t.toFixed(1)+'s';if(!paused&&t<LENGTH)raf=requestAnimationFrame(animate)}
document.getElementById('toggle').onclick=()=>{if(paused){paused=false;started=performance.now()-pauseAt*1000;document.getElementById('toggle').textContent='Pause';raf=requestAnimationFrame(animate)}else{paused=true;pauseAt=+document.getElementById('progress').value;document.getElementById('toggle').textContent='Play';cancelAnimationFrame(raf)}};
document.getElementById('restart').onclick=()=>{paused=false;started=performance.now();document.getElementById('toggle').textContent='Pause';cancelAnimationFrame(raf);raf=requestAnimationFrame(animate)};
document.getElementById('progress').oninput=e=>{paused=true;cancelAnimationFrame(raf);pauseAt=+e.target.value;renderAt(pauseAt);document.getElementById('clock').textContent=pauseAt.toFixed(1)+'s';document.getElementById('toggle').textContent='Play'};
renderAt(0);document.fonts.ready.then(()=>{started=performance.now();raf=requestAnimationFrame(animate)});
