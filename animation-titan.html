function parameterArrow(ctx,points,color,progress,width=2.6){
 const p=clamp(progress);if(p<=.001)return;
 const lengths=[];let total=0;
 for(let i=1;i<points.length;i++){const d=Math.hypot(points[i][0]-points[i-1][0],points[i][1]-points[i-1][1]);lengths.push(d);total+=d}
 let left=total*p;ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';
 ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);let last=points[0],prior=points[0];
 for(let i=1;i<points.length&&left>0;i++){
  const from=points[i-1],to=points[i],d=lengths[i-1],u=Math.min(1,left/d);
  const end=[lerp(from[0],to[0],u),lerp(from[1],to[1],u)];ctx.lineTo(end[0],end[1]);prior=from;last=end;left-=d
 }
 ctx.stroke();if(p>.998){const dx=last[0]-prior[0],dy=last[1]-prior[1],a=Math.atan2(dy,dx);ctx.beginPath();ctx.moveTo(last[0],last[1]);

 ctx.restore()
}

}
function chipCandidate(ctx,x,y,label,variant,t,showAt,selected){
 scene(ctx,fade(t,showAt,showAt+.45),()=>{
  const active=selected&&t>=19.2,st=active?C.green:C.line;
  rect(ctx,x,y,182,231,C.white,st,active?2.3:1.4,8);
  txt(ctx,label,x+91,y+32,20,C.navy,'center',true);
  miniPattern(ctx,x+21,y+49,variant);
  line(ctx,x+16,y+150,x+166,y+150,C.line,1);
  circle(ctx,x+33,y+177,11,C.greenp,C.green,1.3);txt(ctx,'✓',x+33,y+184,19,C.green,'center',true);
  txt(ctx,'通过早期预检',x+99,y+181,16,C.green,'center');
  txt(ctx,active?'入选机柜级探索':'本轮未选',x+91,y+214,15,active?C.navy:C.muted,'center')
 })}
function rackChip(ctx,x,y,label,reveal){
 rect(ctx,x,y,158,61,C.white,'#c3d3dd',1.4,5);
 scene(ctx,reveal,()=>{
  rect(ctx,x+4,y+4,150,53,C.bluep,C.blue,1.2,4);
  rect(ctx,x+16,y+17,20,20,C.tealp,C.teal,1,3);
  rect(ctx,x+41,y+17,20,20,C.bluep,C.blue,1,3);
  txt(ctx,label,x+100,y+37,16,C.navy,'center',true)
 })}
function rackBlueprint(ctx,t){
 panel(ctx,802,281,523,363);tag(ctx,'机柜级设计器 · 候选B的机柜方案',834,318);line(ctx,834,332,1293,332,C.line,1);
 const x=849,y=348;rect(ctx,x,y,430,253,C.white,'#bdced9',1.6,6);
 rect(ctx,903,361,321,40,'#edf4f8',C.blue,1.4,5);
 txt(ctx,'主机接口  HIB',1064,387,19,C.navy,'center',true);
 // A local rack-level schematic bus only, not a new physical die link.
 line(ctx,1064,402,1064,420,C.mesh,2);
 line(ctx,953,420,1175,420,C.mesh,2);
 line(ctx,953,420,953,437,C.mesh,2);line(ctx,1175,420,1175,437,C.mesh,2);
 const v=fade(t,19.15,21.1);
 rackChip(ctx,867,442,'候选 B',fade(t,19.2,19.7));
 rackChip(ctx,1097,442,'候选 B',fade(t,19.7,20.2));
 rackChip(ctx,867,520,'候选 B',fade(t,20.0,20.55));
 rackChip(ctx,1097,520,'候选 B',fade(t,20.5,21.0));
 scene(ctx,fade(t,21.0,21.65),()=>txt(ctx,'空间 ✓    成本 ✓    需求 ✓',1064,625,18,C.green,'center',true))
}
function sceneCabinet(ctx,t){
 const a=phaseAlpha(t,16.94,28,.58,.4);scene(ctx,a,()=>{
  // The design candidates persist into the conclusion; only their annotation fades.
  scene(ctx,1-fade(t,23.65,24.32),()=>phaseHeading(ctx,3,1));
  panel(ctx,116,281,650,363);tag(ctx,'预检通过的芯片候选 · 排序后选子集',142,318);line(ctx,142,332,738,332,C.line,1);
  chipCandidate(ctx,138,351,'候选 B',0,t,17.18,true);
  chipCandidate(ctx,345,351,'候选 C',1,t,17.78,true);
  chipCandidate(ctx,552,351,'候选 D',2,t,18.35,false);
  rackBlueprint(ctx,t);
  scene(ctx,(1-fade(t,23.5,24.15))*fade(t,21.0,21.8),()=>{
    txt(ctx,'评价器预测算力、存储/通信带宽和成本',720,692,20,C.blue,'center',true);
    txt(ctx,'按目标从已探索的可行方案中选取，不证明全局最优',720,720,17,C.muted,'center')
  })
 })}
function sceneConclusion(ctx,t){
 const a=fade(t,23.65,24.35);scene(ctx,a,()=>{
  phaseHeading(ctx,4,1);
  scene(ctx,fade(t,24.4,25.45),()=>{
   line(ctx,394,704,1046,704,C.green,3);
   txt(ctx,'通过跨层预检的芯片，才进入各自的机柜探索',720,688,23,C.green,'center',true);
   txt(ctx,'选择设计，不是运行中改装机柜',720,738,17,C.muted,'center')
  })
 })}
function drawFrame(ctx,time){
 const t=clamp(time,0,28);
 ctx.clearRect(0,0,W,H);ctx.fillStyle=C.white;ctx.fillRect(0,0,W,H);
 ctx.fillStyle=C.navy;ctx.fillRect(78,53,9,46);
 txt(ctx,'TITAN',105,91,42,C.navy,'left',true);
 txt(ctx,'纵向跨层约束驱动协同设计',329,90,33,C.navy,'left',true);
 txt(ctx,'设计阶段',1348,85,17,C.muted,'right');
 line(ctx,78,126,1361,126,C.line,1.5);
 // Compress the original two resource-introduction scenes to 0–6 s.
 const early=t<=3?t*(5/3):t<=6?5+(t-3)*2:11+Math.min(t-6,.2)*1.75;
 sceneBottleneck(ctx,early);sceneCoExplore(ctx,early);
 scenePhysical(ctx,t);
 // Preserve the accepted one-configuration-per-cabinet scene at 20–24 s.
 const cabinetT=t<19.6?16.94:t<=24?17+(t-19.6)*(7/4.4):t;
 sceneCabinet(ctx,cabinetT);sceneConclusion(ctx,t);
 line(ctx,77,765,1363,765,C.line,1);
 txt(ctx,'Titan · 片内设计器 / 机柜级设计器 / 评价器',80,791,15,C.muted);
 txt(ctx,'设计机制示意，非实物或性能比例',1362,791,15,C.muted,'right')
}
</script>
<script>
(()=>{
const canvas=document.getElementById('titan'),ctx=canvas.getContext('2d');
const seek=document.getElementById('seek'),clock=document.getElementById('clock'),play=document.getElementById('play');
let at=0,playing=false,start=0,raf=0;
const refresh=()=>{drawFrame(ctx,at);seek.value=at.toFixed(2);clock.textContent=`${at.toFixed(2)} / 28.00 秒`;play.textContent=playing?'暂停':'播放'};
function tick(now){if(!playing)return;at=Math.min(DURATION,(now-start)/1000);refresh();if(at>=DURATION){playing=false;refresh();return}raf=requestAnimationFrame(tick)}
function resume(){if(at>=DURATION)at=0;playing=true;start=performance.now()-at*1000;raf=requestAnimationFrame(tick);refresh()}
play.addEventListener('click',()=>{if(playing){playing=false;cancelAnimationFrame(raf);refresh()}else resume()});
document.getElementById('restart').addEventListener('click',()=>{cancelAnimationFrame(raf);at=0;resume()});
seek.addEventListener('input',()=>{playing=false;cancelAnimationFrame(raf);at=Number(seek.value);refresh()});
window.drawAt=t=>{playing=false;cancelAnimationFrame(raf);at=clamp(t,0,DURATION);refresh()};
document.fonts.ready.then(refresh)
})();
</script>
