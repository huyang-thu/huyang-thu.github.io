function renderAt(val){const t=clamp(val,0,HOLD);page(t);const id=state(t).id;if(id==='problem')problem(t);else if(id==='model')model(t);else if(id==='domain')domain(t);else if(id==='reference')reference(t);else summary(t);return true}
window.renderAt=renderAt;window.getTextBounds=()=>TEXT_BOUNDS.slice();
let start=performance.now(),paused=false,holdTime=0,raf=0;
function step(now){let t=paused?holdTime:Math.min(DUR,(now-start)/1000);renderAt(t);let pr=document.getElementById('progress');if(document.activeElement!==pr)pr.value=t;document.getElementById('clock').textContent=t.toFixed(1)+'s';if(!paused&&t<DUR)raf=requestAnimationFrame(step)}
document.getElementById('toggle').onclick=()=>{if(paused){paused=false;start=performance.now()-holdTime*1000;document.getElementById('toggle').textContent='Pause';raf=requestAnimationFrame(step)}else{paused=true;holdTime=+document.getElementById('progress').value;document.getElementById('toggle').textContent='Play';cancelAnimationFrame(raf)}};
document.getElementById('restart').onclick=()=>{paused=false;start=performance.now();document.getElementById('toggle').textContent='Pause';raf=requestAnimationFrame(step)};
document.getElementById('progress').oninput=e=>{paused=true;cancelAnimationFrame(raf);holdTime=+e.target.value;renderAt(holdTime);document.getElementById('clock').textContent=holdTime.toFixed(1)+'s';document.getElementById('toggle').textContent='Play'};
renderAt(0);document.fonts.ready.then(()=>{start=performance.now();raf=requestAnimationFrame(step)});
</script></body></html>
