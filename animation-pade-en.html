<script>
'use strict';
const D=JSON.parse(document.getElementById('pade-data').textContent);
const R=PADE.createRenderer(document.getElementById('cv'),D,{fontFamily:'PADE'});
const slider=document.getElementById('progress'),toggle=document.getElementById('toggle'),clock=document.getElementById('clock');
let paused=true,current=0,epoch=0,raf=0;
function display(t){current=Math.max(0,Math.min(54,t));R.renderAt(current);slider.value=current;clock.textContent=current.toFixed(1)+' / 54.0s';}
function stop(){paused=true;cancelAnimationFrame(raf);toggle.textContent='Play';}
function step(now){if(paused)return;display((now-epoch)/1000);if(current>=54){stop();return}raf=requestAnimationFrame(step)}
function play(){if(current>=54)current=0;cancelAnimationFrame(raf);paused=false;epoch=performance.now()-current*1000;toggle.textContent='Pause';raf=requestAnimationFrame(step)}
toggle.onclick=()=>paused?play():stop();
document.getElementById('restart').onclick=()=>{stop();display(0);play()};
slider.oninput=()=>{stop();display(Number(slider.value))};
document.addEventListener('keydown',e=>{if(e.target===slider)return;if(e.code==='Space'){e.preventDefault();paused?play():stop()}if(e.code==='ArrowLeft'||e.code==='ArrowRight'){e.preventDefault();stop();display(current+(e.code==='ArrowRight'?1:-1))}});
window.renderAt=t=>{stop();display(t);return true};window.getTextBounds=()=>R.getTextBounds();window.getFrameAudit=()=>R.getFrameAudit();
window.PADE_TEST={data:D,renderer:R,state:()=>({paused,current}),play,stop};
display(0);document.fonts.ready.then(()=>{display(current);if(new URLSearchParams(location.search).get('autoplay')!=='0')play()});
</script></body></html>
