  naive(ctx,t);activeRound(ctx,t);relay(ctx,t);finish(ctx,t);drawFooter(ctx,t);
}
</script>
<script>
(()=>{
const canvas=document.getElementById('temp'),ctx=canvas.getContext('2d');
const seek=document.getElementById('seek'),clock=document.getElementById('clock'),play=document.getElementById('play');
let at=0,playing=false,start=0,raf=0;
const refresh=()=>{drawFrame(ctx,at);seek.value=at.toFixed(2);clock.textContent=`${at.toFixed(2)} / 28.00 s`;play.textContent=playing?'Pause':'Play'};
function tick(now){if(!playing)return;at=Math.min(DURATION,(now-start)/1000);refresh();if(at>=DURATION){playing=false;refresh();return}raf=requestAnimationFrame(tick)}
function resume(){if(at>=DURATION)at=0;playing=true;start=performance.now()-at*1000;raf=requestAnimationFrame(tick);refresh()}
play.addEventListener('click',()=>{if(playing){playing=false;cancelAnimationFrame(raf);refresh()}else resume()});
document.getElementById('restart').addEventListener('click',()=>{cancelAnimationFrame(raf);at=0;resume()});
seek.addEventListener('input',()=>{playing=false;cancelAnimationFrame(raf);at=Number(seek.value);refresh()});
window.drawAt=t=>{playing=false;cancelAnimationFrame(raf);at=clamp(t,0,DURATION);refresh()};
document.fonts.ready.then(refresh);
})();
</script>
