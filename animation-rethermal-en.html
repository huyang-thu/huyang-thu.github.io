toggle.onclick=()=>paused?play():stop();
document.getElementById('restart').onclick=()=>{stop();display(0);play();};
slider.oninput=()=>{stop();display(Number(slider.value));};
document.addEventListener('keydown',e=>{
  if(e.target===slider)return;
  if(e.code==='Space'){e.preventDefault();paused?play():stop();}
  if(e.code==='ArrowLeft'||e.code==='ArrowRight'){e.preventDefault();stop();display(current+(e.code==='ArrowRight'?1:-1));}
});
window.renderAt=t=>{stop();display(t);return true;};
window.getFrameAudit=()=>R.getFrameAudit();
window.getTextBounds=()=>R.getTextBounds();
window.RETHERMAL_TEST={data:D,renderer:R,state:()=>({paused,current,language}),play,stop};
Promise.all([document.fonts.load('400 24px "ReThermal"'),document.fonts.load('700 24px "ReThermal"')])
  .then(()=>document.fonts.ready)
  .then(()=>{display(current);if(new URLSearchParams(location.search).get('autoplay')!=='0')play();});
</script></body></html>
