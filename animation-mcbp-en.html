    return {renderAt,getTextBounds:()=>bounds.map(b=>({...b})),getFrameAudit:()=>JSON.parse(JSON.stringify(audit)),stateAt:t=>stateAt(D,t)};
  }

</script><script>'use strict';
const D=JSON.parse(document.getElementById('mcbp-data').textContent);
const R=MCBP.createRenderer(document.getElementById('cv'),D,{fontFamily:'MCBP'});
const slider=document.getElementById('progress'),toggle=document.getElementById('toggle'),clock=document.getElementById('clock');
const duration=D.scenes.duration_seconds;
let paused=true,current=0,epoch=0,raf=0;
function display(t){current=Math.max(0,Math.min(duration,t));R.renderAt(current);slider.value=current;clock.textContent=current.toFixed(1)+' / '+duration.toFixed(1)+'s';}
function stop(){paused=true;cancelAnimationFrame(raf);toggle.textContent='Play';toggle.setAttribute('aria-label','Play animation');}
function step(now){if(paused)return;display((now-epoch)/1000);if(current>=duration){stop();return;}raf=requestAnimationFrame(step);}
function play(){if(current>=duration)current=0;cancelAnimationFrame(raf);paused=false;epoch=performance.now()-current*1000;toggle.textContent='Pause';toggle.setAttribute('aria-label','Pause animation');raf=requestAnimationFrame(step);}
toggle.onclick=()=>paused?play():stop();
document.getElementById('restart').onclick=()=>{stop();display(0);play();};
slider.oninput=()=>{stop();display(Number(slider.value));};
document.addEventListener('keydown',e=>{if(e.target===slider)return;if(e.code==='Space'){e.preventDefault();paused?play():stop();}if(e.code==='ArrowLeft'||e.code==='ArrowRight'){e.preventDefault();stop();display(current+(e.code==='ArrowRight'?1:-1));}});
window.renderAt=t=>{stop();display(t);return true;};
window.getFrameAudit=()=>R.getFrameAudit();window.getTextBounds=()=>R.getTextBounds();
window.MCBP_TEST={data:D,renderer:R,state:()=>({paused,current}),play,stop};
display(0);
document.fonts.ready.then(()=>{display(current);if(new URLSearchParams(location.search).get('autoplay')!=='0')play();});
</script></body></html>
