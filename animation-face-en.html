function renderAt(raw){const t=clamp(raw,0,SC.hold_from); header(t); meshBoard(t); const sid=stage(t).id; if(sid==='cse')sideCSE(t); else if(sid==='das')sideDAS(t); else if(sid==='omm')sideOMM(t); else if(sid==='arch')sideArch(t); else sideSummary(); footer(); return true; }
window.renderAt=renderAt; window.getTextBounds=()=>TEXT_BOUNDS;
let started=performance.now(),paused=false,pauseAt=0,raf=0;
function animate(now){const t=paused?pauseAt:Math.min(LENGTH,(now-started)/1000); renderAt(t); const p=document.getElementById('progress'); if(document.activeElement!==p)p.value=t; document.getElementById('clock').textContent=t.toFixed(1)+'s'; if(!paused&&t<LENGTH)raf=requestAnimationFrame(animate)}
document.getElementById('toggle').onclick=()=>{if(paused){paused=false;started=performance.now()-pauseAt*1000;document.getElementById('toggle').textContent='Pause';raf=requestAnimationFrame(animate)}else{paused=true;pauseAt=+document.getElementById('progress').value;document.getElementById('toggle').textContent='Play';cancelAnimationFrame(raf)}};
document.getElementById('restart').onclick=()=>{paused=false;started=performance.now();document.getElementById('toggle').textContent='Pause';cancelAnimationFrame(raf);raf=requestAnimationFrame(animate)};
document.getElementById('progress').oninput=e=>{paused=true;cancelAnimationFrame(raf);pauseAt=+e.target.value;renderAt(pauseAt);document.getElementById('clock').textContent=pauseAt.toFixed(1)+'s';document.getElementById('toggle').textContent='Play'};
renderAt(0); document.fonts.ready.then(()=>{started=performance.now(); raf=requestAnimationFrame(animate)});
